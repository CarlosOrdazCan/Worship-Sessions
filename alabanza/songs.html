<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Canción | CAN ALABANZA</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }
        .section-item {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent-red);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }
    </style>
    <link rel="icon" type="image/png" href="can-logo.png">
</head>
<body class="animate-up">
    <script>
        if (!localStorage.getItem("token")) window.location.href = "login.html";

        const savedWallpaper = localStorage.getItem("cordaz_wallpaper");
        if (savedWallpaper) {
            document.body.classList.add("ios-wallpaper-active");
            document.body.style.setProperty("--ios-bg-image", `url(${savedWallpaper})`);
        }
    </script>

    <!-- Navigation Header -->
    <div class="pco-navbar">
        <div style="display:flex; align-items:center; gap:20px;">
            <button class="secondary" onclick="location.href='overview.html'" style="padding:10px 18px; font-weight:800;">← VOLVER AL REPERTORIO</button>
            <span style="font-family:var(--font-title); font-weight:800; font-size:18px; letter-spacing:1px;">NUEVA <span style="color:var(--accent-red); font-weight:400;">CANCIÓN</span></span>
        </div>
        <button class="primary" onclick="saveSong()" style="padding:10px 22px; font-size:12px; font-weight:800;">💾 GUARDAR</button>
    </div>

    <div class="container animate-fade">
        <div class="glass-card">
            <h2 style="color: var(--accent-red); margin-bottom:25px; font-family:var(--font-title); font-weight:900; font-size:22px; text-transform:uppercase;">Registrar en el Repertorio</h2>
            
            <div class="form-grid">
                <div class="pco-input-group">
                    <label>Título de la Canción</label>
                    <input id="title" placeholder="Ej: Way Maker">
                </div>
                <div class="pco-input-group">
                    <label>Artista / Director</label>
                    <input id="artist" placeholder="Ej: Sinach">
                </div>
                <div class="pco-input-group">
                    <label>Tono Base</label>
                    <input id="key" placeholder="Ej: G#m o E">
                </div>
                <div class="pco-input-group">
                    <label>BPM / Tempo</label>
                    <input id="tempo" placeholder="Ej: 68">
                </div>
            </div>

            <h3 style="margin-top: 30px; margin-bottom:15px; font-family:var(--font-title); font-weight:900; color:white; font-size:18px;">Estructura de Acordes</h3>
            <div id="sectionsContainer"></div>
            
            <button class="secondary" onclick="addSectionUI()" style="margin-top:10px; font-size:11px; padding:10px 18px; border-color:var(--accent-red); color:var(--accent-red);">+ AÑADIR SECCIÓN</button>

            <div style="margin-top: 40px; border-top: 1px solid var(--border-color); padding-top: 25px;">
                <button class="primary" onclick="saveSong()" style="width:100%; font-size:15px; padding:16px; font-weight:900;">💾 GUARDAR EN EL SISTEMA</button>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem("token");

        function addSectionUI() {
            const container = document.getElementById("sectionsContainer");
            const div = document.createElement("div");
            div.className = "section-item animate-fade";
            div.innerHTML = `
                <div style="display:flex; gap:12px; align-items:center;">
                    <select class="sec-type" style="width:180px;">
                        <option>Intro</option><option>Verso</option><option>Pre-Coro</option>
                        <option>Coro</option><option>Puente</option><option>Solo</option><option>Outro</option>
                    </select>
                    <input class="sec-chords" placeholder="Acordes (Ej: G D Em C)" style="flex-grow:1; font-family:var(--font-chords); color:var(--accent-blue); font-weight:bold;">
                    <button onclick="this.parentElement.parentElement.remove()" class="danger" style="padding:10px 14px;">✕</button>
                </div>
            `;
            container.appendChild(div);
        }

        async function saveSong() {
            const sectionElements = document.querySelectorAll(".section-item");
            const sections = Array.from(sectionElements).map(el => ({
                name: el.querySelector(".sec-type").value,
                chords: el.querySelector(".sec-chords").value.split(/\s+/).filter(c => c.trim() !== "")
            }));

            const songData = {
                name: document.getElementById("title").value,
                artist: document.getElementById("artist").value,
                key: document.getElementById("key").value,
                tempo: document.getElementById("tempo").value,
                sections: sections
            };

            if(!songData.name) {
                alert("Por favor ingresa el título de la canción.");
                return;
            }

            try {
                const res = await fetch("/songs", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
                    body: JSON.stringify(songData)
                });

                if(res.ok) {
                    location.href = "overview.html";
                } else {
                    alert("Error al guardar. Revisa que todos los campos estén correctos.");
                }
            } catch(e) {
                alert("Error de conexión al servidor.");
            }
        }
        addSectionUI();
    </script>
</body>
</html>
