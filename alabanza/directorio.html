<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff & Directorio | CAN ALABANZA</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .team-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 28px; 
            margin-top: 40px; 
        }

        .member-card { 
            background: var(--bg-glass); 
            backdrop-filter: blur(20px); 
            border: 1px solid var(--border-color); 
            border-radius: var(--radius-pco); 
            padding: 36px 28px; 
            text-align: center; 
            transition: var(--transition); 
            box-shadow: var(--shadow-glass); 
            position: relative;
            overflow: hidden;
        }

        .member-card:hover { 
            transform: translateY(-6px); 
        }

        .member-photo { 
            width: 110px; 
            height: 110px; 
            border-radius: 50%; 
            object-fit: cover; 
            aspect-ratio: 1/1;
            margin-bottom: 20px; 
            transition: var(--transition);
        }

        .member-card:hover .member-photo {
            transform: scale(1.06);
        }

        .member-name {
            font-family: var(--font-title);
            font-size: 18px; 
            font-weight: 800; 
            text-transform: uppercase;
            color: white;
            margin-bottom: 6px;
        }

        .member-role {
            font-size: 12px; 
            font-weight: 800; 
            letter-spacing: 1px; 
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .member-bio {
            font-size: 13px; 
            color: var(--text-muted); 
            line-height: 1.6;
            margin-top: 14px;
        }
    </style>
    <link rel="icon" type="image/png" href="can-logo.png">
</head>
<body class="animate-up">
    <script>
        const token = localStorage.getItem("token");
        if (!token) window.location.href = "login.html";

        const savedWallpaper = localStorage.getItem("cordaz_wallpaper");
        if (savedWallpaper) {
            document.body.classList.add("ios-wallpaper-active");
            document.body.style.setProperty("--ios-bg-image", `url(${savedWallpaper})`);
        }

        // Aplicar Tema Dinámico
        try {
            const storedUser = JSON.parse(localStorage.getItem("user") || "{}");
            const activeMin = localStorage.getItem("activeMinistry") || storedUser.ministry || "Principal";
            const instStr = String(storedUser.instrument || '').toLowerCase();
            const roleStr = String(storedUser.role || '').toLowerCase();

            const isPastor = instStr.includes("pastor") || roleStr.includes("pastor") || activeMin === "Pastoral";
            const isAudio = instStr.includes("audio") || (activeMin === "Produccion" && (storedUser.techBranch || '').includes("Audio"));
            const isProd = activeMin === "Produccion" && !isAudio;
            const isKids = activeMin === "KIDS";

            if (isPastor) document.body.classList.add("theme-pastoral");
            else if (isAudio) document.body.classList.add("theme-audio");
            else if (isProd) document.body.classList.add("theme-prod");
            else if (isKids) document.body.classList.add("theme-kids");
            else document.body.classList.add("theme-principal");
        } catch(e) {}
    </script>

    <!-- Navigation Header -->
    <div class="pco-navbar">
        <div style="display:flex; align-items:center; gap:20px;">
            <button class="secondary" onclick="location.href='index.html'" style="padding:10px 20px; font-weight:800;">← VOLVER AL HUB</button>
            <span style="font-family:var(--font-title); font-weight:800; font-size:18px; letter-spacing:1px;">DIRECTORIO DEL <span style="color:var(--accent-red); font-weight:400;">EQUIPO</span></span>
        </div>
        <button class="danger" onclick="localStorage.clear(); window.location.href='login.html';" style="padding:10px 18px; font-size:11px; font-weight:800;">SALIR</button>
    </div>

    <!-- Main Container -->
    <div class="container animate-fade">
        <header style="margin-bottom:30px; border-bottom:1px solid var(--border-color); padding-bottom:20px;">
            <h1 style="font-size:32px; font-family:var(--font-title); font-weight:900; letter-spacing:-0.5px; color:white;">Directorio del Equipo de Alabanza & Producción</h1>
            <p style="color:var(--text-muted); font-size:14px; margin-top:4px;">Directorio de pastores, líderes, directores de alabanza, músicos y operadores técnicos de CAN.</p>
        </header>

        <!-- Filtros de Categoría / Ministerio -->
        <div style="display:flex; gap:10px; margin-top:24px; flex-wrap:wrap;">
            <button class="secondary" onclick="filterMinistry('all')" style="padding:8px 16px; font-size:11px; font-weight:800;">TODOS</button>
            <button class="secondary" onclick="filterMinistry('Pastor')" style="padding:8px 16px; font-size:11px; font-weight:800; border-color:#2563eb; color:#2563eb;">PASTORAL (AZUL)</button>
            <button class="secondary" onclick="filterMinistry('Audio')" style="padding:8px 16px; font-size:11px; font-weight:800; border-color:#10b981; color:#10b981;">AUDIO FOH (VERDE)</button>
            <button class="secondary" onclick="filterMinistry('Produccion')" style="padding:8px 16px; font-size:11px; font-weight:800; border-color:var(--accent-purple); color:var(--accent-purple);">PRODUCCIÓN TÉCNICA (MORADO)</button>
            <button class="secondary" onclick="filterMinistry('KIDS')" style="padding:8px 16px; font-size:11px; font-weight:800; border-color:#00d2ff; color:#00d2ff;">ALABANZA KIDS (CYAN)</button>
            <button class="secondary" onclick="filterMinistry('Principal')" style="padding:8px 16px; font-size:11px; font-weight:800; border-color:var(--accent-red); color:var(--accent-red);">ALABANZA PRINCIPAL (ROJO)</button>
        </div>

        <div class="team-grid" id="teamContainer">
            <div style="text-align:center; grid-column: 1/-1; padding:60px; color:var(--text-muted);">Cargando directorio...</div>
        </div>
    </div>

    <script>
        let directoryUsers = [];

        async function loadDirectory() {
            const container = document.getElementById("teamContainer");
            container.innerHTML = `<div style="text-align:center; grid-column: 1/-1; padding:60px; color:var(--text-muted);"><span style="font-size:24px;">⏳</span><p style="margin-top:8px; font-size:13px;">Cargando directorio...</p></div>`;
            try {
                const res = await fetch("/users", {
                    headers: token ? { "Authorization": `Bearer ${token}` } : {}
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText || 'Error del servidor'}`);
                const data = await res.json();
                directoryUsers = Array.isArray(data) ? data : [];
                renderMembers(directoryUsers);
            } catch(e) {
                console.error("Error al cargar directorio:", e);
                container.innerHTML = `
                    <div style="text-align:center; grid-column:1/-1; padding:40px;">
                        <p style="color:var(--status-red); font-weight:800; font-size:15px; margin-bottom:8px;">⚠️ Error al conectar con el servidor</p>
                        <p style="color:var(--text-muted); font-size:12px; margin-bottom:16px;">${e.message || 'Verifica la conexión a la base de datos'}</p>
                        <button class="secondary" onclick="loadDirectory()" style="padding:10px 20px; font-size:12px; font-weight:800;">🔄 REINTENTAR</button>
                    </div>`;
            }
        }

        function getMemberDesign(user) {
            if (!user) return { color: "#ff2a4b", glow: "rgba(255, 42, 75, 0.4)", tag: "ALABANZA PRINCIPAL", category: "Principal" };
            
            const roleStr = String(user.role || '').toLowerCase();
            const instStr = String(user.instrument || '').toLowerCase();
            const nameStr = String(user.name || '').toLowerCase();
            const minStr = String(user.ministry || 'Principal');

            const isPastor = roleStr.includes("pastor") || instStr.includes("pastor") || nameStr.includes("pastor") || minStr.toLowerCase().includes("pastor");
            const isAudio = instStr.includes("audio") || (minStr === "Produccion" && (user.techBranch || '').includes("Audio"));

            if (isPastor) {
                return {
                    color: "#2563eb", // Azul Zafiro para Pastoral
                    glow: "rgba(37, 99, 235, 0.45)",
                    tag: "PASTORAL",
                    category: "Pastor"
                };
            }

            if (isAudio) {
                return {
                    color: "#10b981", // Verde para Audio
                    glow: "rgba(16, 185, 129, 0.4)",
                    tag: minStr === "Produccion" ? "PROD • AUDIO" : "AUDIO FOH",
                    category: "Audio"
                };
            }

            if (minStr === "Produccion") {
                return {
                    color: "#c084fc", // Morado para Producción
                    glow: "rgba(192, 132, 252, 0.4)",
                    tag: user.techBranch ? `PROD • ${user.techBranch}` : "PRODUCCIÓN",
                    category: "Produccion"
                };
            }

            if (minStr === "KIDS") {
                return {
                    color: "#00d2ff", // Cyan para KIDS
                    glow: "rgba(0, 210, 255, 0.4)",
                    tag: "KIDS",
                    category: "KIDS"
                };
            }

            // Alabanza Principal / Default
            return {
                color: "#ff2a4b",
                glow: "rgba(255, 42, 75, 0.4)",
                tag: minStr === "Hibrido" ? "HÍBRIDO (P/KIDS)" : "ALABANZA PRINCIPAL",
                category: "Principal"
            };
        }

        function renderMembers(users) {
            const container = document.getElementById("teamContainer");
            if (!users || users.length === 0) {
                container.innerHTML = "<p style='color:var(--text-muted); text-align:center; grid-column:1/-1;'>No hay integrantes encontrados en esta categoría.</p>";
                return;
            }

            container.innerHTML = users.map(user => {
                if (!user) return '';
                const design = getMemberDesign(user);
                const displayName = user.name || user.username || 'Sin Nombre';
                const displayRole = user.instrument || user.role || 'Integrante';
                const photoSrc = user.photo || `https://ui-avatars.com/api/?name=${encodeURIComponent(displayName)}&background=0c0a0c&color=${design.color.replace('#','')}&size=200&bold=true`;

                return `
                    <div class="member-card animate-fade" style="border-color:${design.color}33;" onmouseover="this.style.borderColor='${design.color}'; this.style.boxShadow='0 15px 35px ${design.glow}, var(--shadow-glass)'" onmouseout="this.style.borderColor='${design.color}33'; this.style.boxShadow='var(--shadow-glass)'">
                        <img src="${photoSrc}" alt="${displayName}" class="member-photo" style="border: 3px solid ${design.color}; box-shadow: 0 0 22px ${design.glow};">
                        <div class="member-name">${displayName}</div>
                        <div class="member-role" style="color:${design.color};">${displayRole}</div>
                        
                        <div style="display:flex; justify-content:center; margin-bottom:12px;">
                            <span class="status-pill" style="border-color:${design.color}; color:${design.color}; background:${design.color}15; font-size:9px; padding:4px 10px;">${design.tag}</span>
                        </div>

                        ${user.phone ? `<div style="font-size:12px; color:var(--text-muted); margin-bottom:8px;">📱 ${user.phone}</div>` : ''}
                        
                        ${user.bio ? `<div class="member-bio">"${user.bio}"</div>` : ''}
                    </div>
                `;
            }).join('');
        }

        function filterMinistry(min) {
            if (min === "all") {
                renderMembers(directoryUsers);
            } else {
                renderMembers(directoryUsers.filter(u => getMemberDesign(u).category === min));
            }
        }

        loadDirectory();
    </script>
</body>
</html>
