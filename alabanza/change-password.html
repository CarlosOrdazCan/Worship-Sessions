<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña | CAN ALABANZA</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .pass-card {
            max-width: 440px;
            width: 100%;
            padding: 45px 36px;
            text-align: center;
            border-radius: var(--radius-pco);
            border: 1px solid var(--border-color);
            background: var(--bg-glass-heavy);
            box-shadow: var(--shadow-glass);
        }
    </style>
    <link rel="icon" type="image/png" href="can-logo.png">
</head>
<body class="animate-up">
    <script>
        if (!localStorage.getItem("token")) {
            window.location.href = "login.html";
        }
    </script>

    <div class="pass-card">
        <div style="font-size: 44px; margin-bottom: 15px;">🔐</div>
        <h1 style="font-size: 24px; font-family: var(--font-title); font-weight: 900; letter-spacing: -0.5px; margin-bottom: 8px; color: white;">Actualizar Contraseña</h1>
        <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 28px; line-height: 1.5;">Por seguridad de la plataforma, ingresa tu nueva contraseña personal para continuar.</p>

        <div style="text-align: left; margin-bottom: 24px;">
            <div class="pco-input-group">
                <label>Nueva Contraseña</label>
                <input id="newPass" type="password" placeholder="Ingresa tu nueva contraseña segura">
            </div>
        </div>

        <button class="primary" onclick="changePass()" style="width: 100%; padding: 15px; font-weight: 800;">GUARDAR Y CONTINUAR</button>
        <button class="secondary" onclick="location.href='index.html'" style="width: 100%; margin-top: 12px; padding: 12px; font-weight: 700;">CANCELAR</button>
    </div>

    <script>
        async function changePass() {
            const token = localStorage.getItem("token");
            const newPassword = document.getElementById("newPass").value;

            if (!newPassword) {
                alert("Por favor ingresa una contraseña válida.");
                return;
            }

            try {
                const res = await fetch("/profile-update", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    },
                    body: JSON.stringify({ password: newPassword })
                });

                if (res.ok) {
                    alert("¡Contraseña actualizada exitosamente!");
                    window.location.href = "index.html";
                } else {
                    alert("Error al actualizar la contraseña.");
                }
            } catch(e) {
                alert("Error de conexión al servidor.");
            }
        }
    </script>
</body>
</html>
