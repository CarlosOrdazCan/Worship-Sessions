<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas del Repertorio | CAN ALABANZA</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .stat-row {
            display: flex; 
            align-items: center; 
            gap: 20px; 
            margin-bottom: 16px;
            background: var(--bg-glass);
            padding: 20px 24px; 
            border-radius: 16px; 
            border: 1px solid var(--border-color); 
            transition: var(--transition);
            box-shadow: var(--shadow-glass);
        }
        .stat-row:hover { 
            border-color: var(--border-red); 
            transform: translateX(6px); 
            box-shadow: 0 10px 30px rgba(255, 42, 75, 0.08), var(--shadow-glass); 
        }

        .bar-container { 
            flex: 1; 
            background: rgba(0, 0, 0, 0.6); 
            height: 12px; 
            border-radius: 20px; 
            overflow: hidden; 
            border: 1px solid var(--border-color);
        }
        
        .bar-fill { 
            height: 100%; 
            background: linear-gradient(90deg, var(--accent-red), #ff6b81); 
            width: 0%; 
            transition: width 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 0 15px var(--accent-red-glow);
            border-radius: 20px;
        }

        .count-badge { 
            background: var(--accent-red); 
            color: white; 
            padding: 8px 18px; 
            border-radius: 10px; 
            font-family: var(--font-title);
            font-weight: 900; 
            font-size: 13px; 
            min-width: 110px; 
            text-align: center; 
            box-shadow: 0 0 15px var(--accent-red-glow);
        }

        .song-info { width: 280px; }
        .song-name { 
            font-family: var(--font-title);
            font-weight: 800; 
            font-size: 16px; 
            text-transform: uppercase; 
            color: white;
            margin: 0; 
        }
        .song-artist { 
            font-size: 12px; 
            color: var(--text-muted); 
            margin-top: 3px; 
            text-transform: uppercase; 
            font-weight: 700;
        }
    </style>
    <link rel="icon" type="image/png" href="can-logo.png">
</head>
<body class="animate-up">
    <script>
        const token = localStorage.getItem("token");
        if(!token) window.location.replace("login.html");
        
        try {
            const userData = JSON.parse(window.atob(token.split('.')[1]));
            const storedUser = JSON.parse(localStorage.getItem("user") || "{}");
            const role = storedUser.role || userData.role || "";
            const min = storedUser.ministry || userData.ministry || "";
            const inst = String(storedUser.instrument || userData.instrument || '').toLowerCase();
            const isFullAdmin = (role === "Full Administrador" || (storedUser.username && storedUser.username.toLowerCase() === "cordaz"));
            const isPastor = (min === "Pastoral" || role.toLowerCase().includes("pastor") || inst.includes("pastor"));

            if (!isFullAdmin && !isPastor) {
                alert("No tienes acceso, consúltalo con el administrador.");
                window.location.replace("index.html");
            }
        } catch(e) { window.location.replace("login.html"); }

        const activeMin = localStorage.getItem("activeMinistry") || "Principal";
        if(activeMin === "KIDS") document.body.classList.add("kids-theme");

        const savedWallpaper = localStorage.getItem("cordaz_wallpaper");
        if (savedWallpaper) {
            document.body.classList.add("ios-wallpaper-active");
            document.body.style.setProperty("--ios-bg-image", `url(${savedWallpaper})`);
        }
    </script>

    <!-- Navigation Header -->
    <div class="pco-navbar">
        <div style="display:flex; align-items:center; gap:20px;">
            <button class="secondary" onclick="location.href='index.html'" style="padding:10px 18px; font-weight:800;">← VOLVER AL HUB</button>
            <span style="font-family:var(--font-title); font-weight:800; font-size:18px; letter-spacing:1px;">MÉTRICAS & <span style="color:var(--accent-red); font-weight:400;">ESTADÍSTICAS</span></span>
        </div>
        <div id="min-indicator" class="status-pill confirmed" style="font-size:11px; padding:6px 16px;">...</div>
    </div>

    <!-- Main Container -->
    <div class="container animate-fade">
        <header style="margin-bottom:35px; border-bottom:1px solid var(--border-color); padding-bottom:20px;">
            <h1 style="font-size:32px; font-family:var(--font-title); font-weight:900; letter-spacing:-0.5px; color:white;">Frecuencia del Repertorio</h1>
            <p style="color:var(--text-muted); font-size:14px; margin-top:5px;">Análisis de rotación de temas en servicios dominicales archivados.</p>
        </header>

        <div class="glass-card">
            <div style="margin-bottom:30px;">
                <h2 style="margin:0; font-family:var(--font-title); font-weight:900; font-size:22px; color:white; text-transform:uppercase;">TOP 10 CANCIONES MÁS TOCADAS</h2>
                <p style="color:var(--text-muted); margin-top:6px; font-size:13px;">Basado en el historial acumulado de servicios finalizados.</p>
            </div>

            <div id="stats-list">
                <p style="color:var(--text-muted); text-align:center; padding:40px;">Analizando historial...</p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("min-indicator").innerHTML = activeMin === "KIDS" ? `👶 ALABANZA KIDS` : "🎸 ALABANZA PRINCIPAL";

        async function loadStats() {
            try {
                const res = await fetch(`/setlists?ministry=${activeMin}`);
                const raw = await res.json();
                const setlists = Array.isArray(raw) ? raw : [];
                
                const archivedSets = setlists.filter(s => s && s.archived);

                if(archivedSets.length === 0) {
                    document.getElementById("stats-list").innerHTML = `
                        <div style="text-align:center; padding:60px; color:var(--text-muted);">
                            <span style="font-size:48px; display:block; margin-bottom:16px;">📦</span>
                            <p style="font-size:16px; font-weight:800; color:white;">No hay suficientes servicios archivados.</p>
                            <p style="font-size:13px; margin-top:8px;">Archiva servicios pasados desde la sección de Setlists para generar las métricas aquí.</p>
                        </div>`;
                    return;
                }

                let songMap = {};
                
                archivedSets.forEach(set => {
                    if (set.songs) {
                        set.songs.forEach(item => {
                            if(item.songId) {
                                const name = item.songId.name || 'Desconocido';
                                if(!songMap[name]) {
                                    songMap[name] = { count: 0, artist: item.songId.artist || '' };
                                }
                                songMap[name].count++;
                            }
                        });
                    }
                });

                const sorted = Object.entries(songMap)
                    .sort((a, b) => b[1].count - a[1].count)
                    .slice(0, 10);

                if (sorted.length === 0) {
                    document.getElementById("stats-list").innerHTML = "<p style='color:var(--text-muted); text-align:center; padding:40px;'>No hay canciones registradas en los servicios archivados.</p>";
                    return;
                }

                const maxVal = sorted[0][1].count;

                document.getElementById("stats-list").innerHTML = sorted.map(s => {
                    const name = s[0];
                    const count = s[1].count;
                    const artist = s[1].artist;
                    const percentage = Math.max(5, (count / maxVal) * 100);

                    return `
                        <div class="stat-row animate-fade">
                            <div class="song-info">
                                <h4 class="song-name">${name}</h4>
                                <p class="song-artist">${artist || 'CAN Worship'}</p>
                            </div>
                            <div class="bar-container">
                                <div class="bar-fill" data-width="${percentage}"></div>
                            </div>
                            <div class="count-badge">${count} ${count === 1 ? 'VEZ' : 'VECES'}</div>
                        </div>
                    `;
                }).join("");

                setTimeout(() => {
                    document.querySelectorAll('.bar-fill').forEach(bar => {
                        bar.style.width = bar.getAttribute('data-width') + '%';
                    });
                }, 100);

            } catch (e) {
                console.error("Error en stats:", e);
                document.getElementById("stats-list").innerHTML = "<p style='color:var(--status-red); text-align:center;'>Error al conectar con el servidor.</p>";
            }
        }
        
        loadStats();
    </script>
</body>
</html>
