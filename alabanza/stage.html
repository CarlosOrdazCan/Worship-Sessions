<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stage Músicos | C.A.N. PRO</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { 
            background: #040407; 
            overflow: hidden; 
            margin: 0; 
            user-select: none;
        }

        .top-center { position: absolute; top: 25px; left: 50%; transform: translateX(-50%); z-index: 100; }
        .top-left { position: absolute; top: 30px; left: 40px; z-index: 100; max-width: 45%; }
        .top-right { position: absolute; top: 30px; right: 40px; text-align: right; z-index: 100; }
        .bottom-left { position: absolute; bottom: 30px; left: 40px; z-index: 100; }
        .bottom-right { position: absolute; bottom: 30px; right: 40px; text-align: right; z-index: 100; }
        
        .center-stage { 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            padding: 0 80px; 
        }
        
        .song-title { 
            font-size: clamp(28px, 4vw, 48px); 
            font-family: var(--font-title);
            font-weight: 900; 
            color: white; 
            margin: 0; 
            text-transform: uppercase; 
            letter-spacing: -0.5px; 
            text-shadow: 0 5px 15px rgba(0,0,0,0.8); 
        }

        .key-display { 
            font-size: clamp(38px, 5vw, 60px); 
            font-family: var(--font-title);
            font-weight: 900; 
            color: var(--accent-red); 
            margin: 0; 
            line-height: 1; 
            text-shadow: 0 0 20px var(--accent-red-glow); 
        }

        .tempo-display { 
            font-size: 16px; 
            color: var(--accent-blue); 
            font-weight: 800; 
            margin-top: 6px; 
            letter-spacing: 1px;
        }
        
        .chords-block { 
            font-family: var(--font-chords); 
            font-size: clamp(36px, 5.5vw, 68px); 
            font-weight: 800; 
            color: white; 
            line-height: 1.5; 
            letter-spacing: 6px; 
            word-spacing: 20px;
            width: 100%; 
            max-height: 60vh; 
            overflow-y: auto; 
            scrollbar-width: none; 
            text-shadow: 0 10px 30px rgba(0,0,0,0.8); 
        }
        .chords-block::-webkit-scrollbar { display: none; }

        .section-tag { 
            display: inline-block; 
            font-size: 14px; 
            color: var(--accent-red); 
            letter-spacing: 4px; 
            margin-top: 35px; 
            margin-bottom: 12px; 
            font-weight: 900; 
            font-family: var(--font-title); 
            text-transform: uppercase; 
            background: rgba(255, 42, 75, 0.1);
            border: 1px solid var(--border-red);
            padding: 4px 14px;
            border-radius: 8px;
        }
        
        .btn-abandon { 
            background: rgba(8, 6, 10, 0.85); 
            border: 1px solid var(--border-color); 
            color: var(--text-muted); 
            padding: 10px 20px; 
            border-radius: 20px; 
            font-weight: 800; 
            cursor: pointer; 
            letter-spacing: 1.5px; 
            font-size: 11px; 
            transition: var(--transition); 
            backdrop-filter: blur(10px); 
        }
        .btn-abandon:hover { 
            background: var(--status-red); 
            border-color: var(--status-red); 
            color: white; 
            box-shadow: 0 0 15px var(--status-red-glow);
        }
        
        .btn-nav-stage { 
            background: var(--bg-glass-heavy); 
            border: 1px solid var(--border-color); 
            color: white; 
            padding: 20px 35px; 
            border-radius: 16px; 
            font-weight: 900; 
            font-family: var(--font-title);
            font-size: 16px; 
            cursor: pointer; 
            backdrop-filter: blur(15px); 
            transition: var(--transition); 
            box-shadow: var(--shadow-glass); 
        }
        .btn-nav-stage:hover { 
            background: var(--accent-red); 
            border-color: var(--accent-red); 
            transform: translateY(-2px); 
            box-shadow: 0 0 25px var(--accent-red-glow);
        }
        
        .preview-text { 
            color: var(--text-muted); 
            font-size: 12px; 
            font-weight: 800; 
            margin-bottom: 8px; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }

        .transpose-controls { 
            display: flex; 
            justify-content: flex-end; 
            gap: 6px; 
            margin-top: 12px; 
        }
        .btn-trans { 
            background: rgba(255,255,255,0.05); 
            border: 1px solid var(--border-color); 
            color: var(--accent-blue); 
            width: 36px; 
            height: 36px; 
            border-radius: 8px; 
            font-weight: 900; 
            font-size: 16px; 
            cursor: pointer; 
            transition: var(--transition); 
        }
        .btn-trans:hover { 
            background: var(--accent-blue); 
            color: #000; 
            border-color: var(--accent-blue);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }
    </style>
    <link rel="icon" type="image/png" href="can-logo.png">
</head>
<body>
    <script>
        const token = localStorage.getItem("token");
        if (!token) window.location.href = "login.html";

        const savedWallpaper = localStorage.getItem("cordaz_wallpaper");
        if (savedWallpaper) {
            document.body.classList.add("ios-wallpaper-active");
            document.body.style.setProperty("--ios-bg-image", `url(${savedWallpaper})`);
        }
    </script>

    <div class="top-center">
        <button class="btn-abandon" onclick="location.href='stage-select.html'">✕ SALIR DEL STAGE</button>
    </div>

    <div class="top-left animate-fade">
        <h1 id="sName" class="song-title">CARGANDO...</h1>
    </div>

    <div class="top-right animate-fade">
        <div id="sKey" class="key-display">-</div>
        <div id="sTempo" class="tempo-display">- BPM</div>
        <div class="transpose-controls">
            <button class="btn-trans" onclick="adjustTranspose(-1)">−</button>
            <button class="btn-trans" onclick="adjustTranspose(1)">+</button>
        </div>
        <div id="transIndicator" style="color:var(--accent-blue); font-size:11px; font-weight:800; margin-top:4px; display:none;"></div>
    </div>

    <div class="center-stage animate-fade">
        <div id="chordsArea" class="chords-block"></div>
    </div>

    <div class="bottom-left">
        <button class="btn-nav-stage" onclick="prev()">← ANTERIOR</button>
    </div>

    <div class="bottom-right">
        <div id="preview" class="preview-text"></div>
        <button class="btn-nav-stage primary" id="nextBtn" onclick="next()">SIGUIENTE CANCIÓN →</button>
    </div>

    <script src="musicUtils.js"></script>
    <script>
        const setId = new URLSearchParams(window.location.search).get("id");
        let setlist = [];
        let idx = 0;
        let manualSteps = 0;

        async function init() {
            try {
                const res = await fetch("/setlists");
                const raw = await res.json();
                const data = Array.isArray(raw) ? raw : [];
                const s = data.find(x => x && x._id === setId);
                if(s && s.songs && s.songs.length > 0) {
                    setlist = s.songs;
                    loadSong();
                } else {
                    location.href = 'stage-select.html';
                }
            } catch(e) {
                console.error("Error cargando setlist:", e);
                alert("Error cargando el repertorio.");
            }
        }

        function adjustTranspose(val) {
            manualSteps += val;
            
            const indicator = document.getElementById("transIndicator");
            indicator.style.display = manualSteps === 0 ? "none" : "block";
            indicator.innerText = manualSteps > 0 ? `+${manualSteps} ST` : `${manualSteps} ST`;
            
            render();
        }

        function loadSong() {
            manualSteps = 0;
            document.getElementById("transIndicator").style.display = "none";
            render();
        }

        function render() {
            const item = setlist[idx];
            const song = item.songId;
            const targetKey = item.setlistKey || song.key;
            
            const totalSteps = getStepsBetween(song.key, targetKey) + manualSteps;

            document.getElementById("sName").innerText = song.name.toUpperCase();
            document.getElementById("sKey").innerText = transposeChord(song.key, totalSteps);
            document.getElementById("sTempo").innerText = song.tempo ? `${song.tempo} BPM` : '-- BPM';
            
            document.getElementById("chordsArea").innerHTML = song.sections.map(sec => `
                <div>
                    <span class="section-tag">${sec.name}</span>
                    <div>${sec.chords.map(c => `<span style="color:var(--accent-blue);">${transposeChord(c, totalSteps)}</span>`).join(' ')}</div>
                </div>
            `).join("");

            const nextS = setlist[idx + 1];
            if (nextS) {
                document.getElementById("preview").innerText = "SIGUIENTE: " + nextS.songId.name.toUpperCase();
                document.getElementById("nextBtn").innerText = "SIGUIENTE CANCIÓN →";
                document.getElementById("nextBtn").classList.add("primary");
            } else {
                document.getElementById("preview").innerText = "ÚLTIMA CANCIÓN";
                document.getElementById("nextBtn").innerText = "FINALIZAR SETLIST ✓";
            }
        }

        function next() {
            if (idx < setlist.length - 1) { idx++; loadSong(); }
            else { location.href = 'stage-select.html'; }
        }
        function prev() { 
            if (idx > 0) { idx--; loadSong(); } 
        }

        init();
    </script>
</body>
</html>
